name: Build temporary Vercel deploy payload

on:
  push:
    branches: [ops/vercel-payload-20260908]

permissions:
  contents: write

jobs:
  build-payload:
    if: ${{ !contains(github.event.head_commit.message, '[payload-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/vercel-payload-20260908
          fetch-depth: 1
      - name: Build payload parts
        run: |
          python - <<'PY'
          import json, pathlib, shutil
          root = pathlib.Path('.')
          out = root / 'deploy-payload'
          shutil.rmtree(out, ignore_errors=True)
          out.mkdir()
          files = []
          roots = ['package.json', 'vercel.json', 'config.json', 'collect.mjs']
          for name in roots:
              p = root / name
              if p.exists(): files.append(p)
          for folder in ['api', 'lib', 'public', 'prompts', 'schemas']:
              base = root / folder
              if base.exists():
                  files.extend(p for p in base.rglob('*') if p.is_file())
          files = sorted(set(files), key=lambda p: p.as_posix())
          rows = []
          for p in files:
              rows.append({'file': p.as_posix(), 'data': p.read_text(encoding='utf-8')})
          parts, current, size = [], [], 0
          limit = 42000
          for row in rows:
              encoded = json.dumps(row, ensure_ascii=False, separators=(',', ':'))
              if current and size + len(encoded) > limit:
                  parts.append(current); current=[]; size=0
              current.append(row); size += len(encoded)
          if current: parts.append(current)
          for i, part in enumerate(parts, 1):
              (out / f'part-{i:03d}.json').write_text(json.dumps(part, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          manifest = {'sourceCommit': '${{ github.sha }}', 'files': len(rows), 'parts': len(parts), 'paths': [p.as_posix() for p in files]}
          (out / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          print(manifest)
          PY
      - name: Commit payload
        run: |
          git config user.name 'MOLIP deploy bot'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-payload
          git commit -m 'chore: [payload-generated] build temporary Vercel payload'
          git push origin HEAD:ops/vercel-payload-20260908
