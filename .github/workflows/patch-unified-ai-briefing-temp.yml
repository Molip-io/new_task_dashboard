name: Patch unified AI briefing

on:
  push:
    branches: [feat/unified-ai-briefing-20260909-2]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-ai-briefing-20260909-2
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply unified briefing patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'missing target in {path}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))

          def regex_once(path, pattern, replacement):
              text = read(path)
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'pattern matched {count} times in {path}: {pattern[:120]!r}')
              write(path, text)

          # Agent Instructions: strengthen project-level narrative quality without changing the schema.
          project_quality = '''### 프로젝트 통합 브리핑 작성 기준

`projects[].projectBriefing`은 프로젝트의 숫자 현황표가 아니라, 대표가 읽었을 때 **현재 상황의 흐름이 바로 이해되는 자연어 브리핑**이어야 한다. 새 실행에서는 `outputSchema`가 이 필드를 허용하는 한 반드시 작성한다.

`projectBriefing.currentProgress`는 프로젝트 단위에서 다음 질문에 답해야 한다.

> 이 프로젝트는 지금 무엇을 목표로 하고 있고, 확인된 범위에서 무엇이 진행·완료됐으며, 현재 핵심적으로 무엇을 하고 있고, 무엇이 남았고, 다음 중요한 단계는 무엇인가?

작성 순서는 가능한 범위에서 다음 흐름을 따른다.

1. 프로젝트가 현재 만들거나 해결하려는 핵심 목표·산출물
2. 직접 근거로 확인된 진행·완료 범위
3. 지금 핵심적으로 진행 중인 일과 현재 단계
4. 아직 남은 범위·검증·결정
5. 직접 근거로 확인되는 다음 중요한 단계

상태명, 완료율, 활성 작업 수, 기한 초과 수, 가이드 위반 수, 진행 준비 수 같은 정량값은 **보조 근거**다. 숫자나 상태값을 문장의 중심으로 나열해 `currentProgress`를 대체하지 않는다. 첫 문장만 읽어도 프로젝트가 지금 어느 단계에 있는지 이해할 수 있어야 한다.

다음과 같은 문장은 실패로 본다.

- `Sprint3 진행 중이며 활성 작업 8건, 완료율 72%, 기한 초과 2건이다.`
- `진행 중 스펙 4개와 확인 필요 항목 3개가 있다.`
- `가이드 위반이 감소했고 진행 준비 항목이 남아 있다.`

이런 경우 저장하지 말고 `specCatalog`, `specSummaries`, `recent_execution`, `persistent_context`, `project_operation`, 허용된 회의록·Git 근거를 다시 종합해 **무엇이 진행되고 있는지 중심으로 다시 작성**한다.

`projectBriefing.buildRelease`와 `projectBriefing.data`는 `currentProgress`의 숫자 반복이 아니라 서로 다른 축이다.

- `buildRelease`: 확인된 빌드·QA/리뷰·심사·배포·출시 상태. 버전과 플랫폼을 섞지 않는다.
- `data`: 배포·테스트 이후 확인된 결과와 관찰 상태. 버전·기간·국가·비교군을 섞지 않는다.
- `confirmationRequired`: 사실 확인이 더 필요한 항목. 실행 병목으로 올리지 않는다.
- `blockers`: 현재 실행·완료 조건·후속 일정에 직접 영향을 주는 미해결 병목만 기록한다.
- `nextActions`: 원문에 합의된 행동과 AI 확인 제안을 구분한다.

`projects[].summary`는 `projectBriefing.currentProgress`와 별개의 숫자 요약을 만들지 않는다. **`currentProgress`를 1~2문장으로 압축한 프로젝트 요약**으로 작성하고, 프로젝트 브리핑과 의미가 충돌하지 않게 한다.

`overall.summary`는 회사 전체 관점의 통합 요약이다. 프로젝트별 `currentProgress`를 한 줄씩 반복하지 말고, 여러 프로젝트를 관통하는 현재 상황·우선순위·큰 위험·대표 판단 맥락만 요약한다. 개별 프로젝트의 상세 진행은 `projects[].projectBriefing`에서 설명한다.

저장 전 품질 게이트:

- `currentProgress`만 읽어도 “무엇을 하고 있는가 / 어디까지 왔는가 / 무엇이 남았는가”가 이해되는가?
- 숫자·상태명·완료율이 문장의 주어가 되어 있지 않은가?
- 최신 Slack 한 문장이나 KPI를 그대로 옮긴 것이 아니라 여러 관련 근거를 종합했는가?
- 완료·QA·배포·데이터 상태를 근거 없이 확장하지 않았는가?
- `project.summary`가 `currentProgress`와 같은 상황을 더 짧게 설명하고 있는가?

하나라도 충족하지 못하면 저장 전에 다시 작성한다.

'''
          path = 'agent-package/01_AGENT_INSTRUCTIONS.md'
          marker = '### 스펙 요약 작성 알고리즘과 품질 게이트\n'
          text = read(path)
          if '### 프로젝트 통합 브리핑 작성 기준' not in text:
              if marker not in text:
                  raise SystemExit('agent instructions project quality marker missing')
              text = text.replace(marker, project_quality + marker, 1)
          text = text.replace('`project.summary`도 스펙별 실제 산출물과 현재 단계를 합쳐 작성한다. 가이드 위반 건수·완료율·`RULE_NOT_EVALUATED`만 나열한 프로젝트 요약은 허용하지 않는다.', '`project.summary`는 `projectBriefing.currentProgress`를 1~2문장으로 압축한 요약으로 작성한다. 스펙별 실제 산출물과 현재 단계를 연결하되 가이드 위반 건수·완료율·`RULE_NOT_EVALUATED`만 나열한 프로젝트 요약은 허용하지 않는다.', 1)
          write(path, text)

          # Daily run prompt: force a project narrative quality gate each run.
          path = 'agent-package/02_DAILY_RUN_PROMPT.md'
          daily_insert = '''\n17-1. 모든 요약 대상 프로젝트에 `projectBriefing`을 작성해. `currentProgress`는 숫자 현황표가 아니라 대표가 읽으면 현재 상황이 그려지는 자연어 브리핑이어야 해. `specCatalog` 전체, `specSummaries`, `recent_execution`, 필요한 `persistent_context`, `project_operation`, 허용된 meeting/Git 근거를 종합해서 가능한 범위에서 **무엇을 목표로 하는지 → 무엇이 확인된 범위에서 진행·완료됐는지 → 지금 핵심적으로 무엇을 하는지 → 무엇이 남았는지 → 다음 중요한 단계가 무엇인지**를 연결해. 상태·완료율·활성 작업 수·기한 초과 수·가이드 위반 수는 보조 근거로만 쓰고 문장의 중심으로 나열하지 마. `buildRelease`는 버전·플랫폼별 빌드/QA/심사/출시 상태, `data`는 버전·기간·국가·비교군을 구분한 결과·관찰 상태로 분리해. 단순 확인은 `confirmationRequired`, 실제 실행 영향이 있는 미해결 문제만 `blockers`, 합의된 행동과 AI 확인 제안은 `nextActions.kind`로 구분해. `projects[].summary`는 `currentProgress`를 1~2문장으로 압축하고 별도의 숫자 요약을 만들지 마. `overall.summary`는 회사 전체 관점만 요약하고 프로젝트별 진행 문장을 반복하지 마. 저장 전에 `currentProgress`만 읽어도 “무엇을 하고 있고 / 어디까지 왔고 / 무엇이 남았는가”가 이해되는지 검사해. `Sprint3 진행 중, 활성 작업 8건, 완료율 72%`처럼 숫자·상태 나열형이면 저장하지 말고 관련 근거를 다시 종합해 상황 중심 문장으로 다시 작성해.\n'''
          text = read(path)
          if '17-1. 모든 요약 대상 프로젝트에 `projectBriefing`을 작성해.' not in text:
              if '\n</analysis_contract>' not in text:
                  raise SystemExit('daily prompt analysis contract marker missing')
              text = text.replace('\n</analysis_contract>', daily_insert + '\n</analysis_contract>', 1)
          write(path, text)

          # Runtime execution guide mirrors the same quality bar.
          path = 'prompts/업무대시보드_에이전트_실행지시.md'
          runtime_insert = '''### 프로젝트 통합 브리핑 품질 기준\n\n- `projectBriefing.currentProgress`는 프로젝트의 숫자 현황표가 아니라, 대표가 읽었을 때 현재 상황의 흐름이 이해되는 자연어 브리핑으로 작성한다.\n- `specCatalog` 전체, `specSummaries`, `recent_execution`, 필요한 `persistent_context`, `project_operation`, 허용된 회의록·Git 근거를 종합해 가능한 범위에서 **목표·핵심 산출물 → 확인된 진행·완료 범위 → 현재 핵심 작업과 단계 → 남은 범위·검증 → 다음 중요한 단계**를 연결한다.\n- 상태·완료율·활성 작업 수·기한 초과 수·가이드 위반 수는 보조 근거다. 숫자나 상태값을 문장의 중심으로 나열하지 않는다.\n- `buildRelease`와 `data`는 현재 진행 요약과 분리한다. 빌드/QA/심사/출시는 버전·플랫폼을, 데이터는 버전·기간·국가·비교군을 구분한다.\n- `confirmationRequired`는 확인 필요, `blockers`는 직접 실행 영향이 있는 미해결 병목, `nextActions`는 합의 행동과 AI 확인 제안을 구분한다.\n- `projects[].summary`는 `currentProgress`를 1~2문장으로 압축하며 별도의 숫자 요약을 만들지 않는다. `overall.summary`는 회사 전체 관점만 요약하고 프로젝트별 진행을 반복하지 않는다.\n- 저장 전에 `currentProgress`만 읽어도 “무엇을 하고 있고 / 어디까지 왔고 / 무엇이 남았는가”가 이해되는지 검사한다. 숫자·상태 나열형이면 관련 근거를 다시 종합해 상황 중심 문장으로 다시 작성한다.\n\n'''
          text = read(path)
          marker = '### 프로젝트\n\n'
          if '### 프로젝트 통합 브리핑 품질 기준' not in text:
              if marker not in text:
                  raise SystemExit('runtime project writing marker missing')
              text = text.replace(marker, marker + runtime_insert, 1)
          write(path, text)

          # Runtime packet contract uses the same narrative rule.
          path = 'lib/agent-project-operations.mjs'
          text = read(path)
          old = "새 분석에서는 outputSchema의 projects[].projectBriefing을 작성한다. project.goal·milestones·specCatalog 전체·sourceEvidence 전체(recent_execution/persistent_context/project_operation)·허용 meetingReferences·gitEvidence를 종합해 currentProgress(프로젝트 전반의 진행), buildRelease, data를 구분한다. 관련 직접 근거만 쓰며 Slack 최신 발췌 복사나 KPI 나열을 통합 요약으로 쓰지 않는다. 버전·플랫폼·관찰 기간이 다른 개발/QA/배포/데이터는 분리한다. buildRelease/data 미확인은 null, 제한은 confidenceLimits, 단순 확인은 confirmationRequired, 실제 실행 영향이 있는 병목만 기존 blockers에 기록한다. nextActions.kind는 합의 근거가 있으면 agreed, AI 확인 제안이면 suggested_check다. 사용한 출처만 evidence로 연결하고 출처 미수집을 활동 없음으로 단정하지 않는다. 기존 summary는 세 축을 압축해 유지하며 출력 스키마에 없는 필드는 생성하지 않는다."
          new = "새 분석에서는 outputSchema의 projects[].projectBriefing을 작성한다. project.goal·milestones·specCatalog 전체·specSummaries·sourceEvidence 전체(recent_execution/persistent_context/project_operation)·허용 meetingReferences·gitEvidence를 종합해 currentProgress(프로젝트 전반의 진행), buildRelease, data를 구분한다. currentProgress는 숫자 현황표가 아니라 대표가 읽었을 때 무엇을 목표로 하고, 확인된 범위에서 어디까지 왔으며, 지금 무엇을 하고, 무엇이 남았고, 다음 중요한 단계가 무엇인지 이해되는 자연어 브리핑으로 작성한다. 상태·완료율·활성 작업 수·기한 초과·가이드 위반 수는 보조 근거로만 쓰고 Slack 최신 발췌 복사나 KPI 나열을 통합 요약으로 쓰지 않는다. 버전·플랫폼·관찰 기간이 다른 개발/QA/배포/데이터는 분리한다. buildRelease/data 미확인은 null, 제한은 confidenceLimits, 단순 확인은 confirmationRequired, 실제 실행 영향이 있는 병목만 기존 blockers에 기록한다. nextActions.kind는 합의 근거가 있으면 agreed, AI 확인 제안이면 suggested_check다. 사용한 출처만 evidence로 연결하고 출처 미수집을 활동 없음으로 단정하지 않는다. projects[].summary는 currentProgress를 1~2문장으로 압축하며 별도의 숫자 요약을 만들지 않고, overall.summary는 회사 전체 관점만 요약한다. 출력 스키마에 없는 필드는 생성하지 않는다."
          if old not in text:
              raise SystemExit('agent packet narrative constraint target missing')
          write(path, text.replace(old, new, 1))

          # Dashboard: overall + project briefings are one AI integrated briefing.
          path = 'public/dashboard-presenters-base.js'
          text = read(path)
          text, count = re.subn(r"  const sourceBackedRisks = \(dashboard\.projects \|\| \[\]\).*?\.filter\(Boolean\);\n  const agentRisks =", "  const agentRisks =", text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('sourceBackedRisks block not found')
          text = text.replace('const importantRisks = [...sourceBackedRisks, ...agentRisks]', 'const importantRisks = [...agentRisks]', 1)
          return_pattern = r"  return `<div class=\"section-head\"><div><h2>오늘의 업무 브리핑</h2>.*?\$\{sprintOverviewHtml\(dashboard, \{ kpisHtml: scopedKpis, initialDetail: selectedDetail, initialFilters: briefingFilters \}\)\}`;\n"
          new_return = '''  const executiveDecisions = ['success', 'partial', 'stale'].includes(analysisStatus) ? dashboard.ai?.overall?.decisionsForCEO || [] : [];
  const decisionHtml = executiveDecisions.length
    ? `<div class="analysis-risks analysis-decisions"><h4>대표 판단 필요</h4>${executiveDecisions.map(item => `<div class="briefing-row"><strong><span class="dot info"></span>${esc(item.project ? `[${item.project}] ` : '')}${esc(item.question || item)}</strong>${item.context ? `<small>${esc(item.context)}</small>` : ''}</div>`).join('')}</div>`
    : '';
  return `<div class="section-head"><div><h2>오늘의 업무 브리핑</h2><p>AI 통합 브리핑 → 어제와 달라진 것 → 스프린트별 업무 현황 순서입니다. 업무 원본에 대해 이 화면은 읽기 전용입니다.</p></div></div>
    ${selectedDetail === 'git' ? briefingDetailHtml(dashboard, 'git', taskRows, briefingFilters) : ''}
    <div class="bento briefing-primary-bento">
    <div class="card span-12 ai-integrated-briefing-card"><h3>1. AI 통합 브리핑${analysisStatus === 'stale' ? ' · 갱신 필요' : ''}</h3>${overallSummary ? `<p class="summary analysis-summary">${esc(overallSummary)}</p>` : `<div class="summary">${esc(analysisEmpty)}</div>`}${importantRiskHtml}${decisionHtml}<div data-project-briefings-slot></div></div>
    <div class="card span-12"><h3>2. 어제와 달라진 것</h3>${dashboard.deltas.length ? dashboard.deltas.slice(0, 5).map(delta => `<div class="briefing-row"><strong><span class="dot info"></span>[${esc(delta.project)}] ${esc(delta.taskTitle || '프로젝트')} · ${esc(delta.field)}</strong><small>${esc(JSON.stringify(delta.from))} → ${esc(JSON.stringify(delta.to))}</small></div>`).join('') : `<div class="summary">${esc(dashboard.snapshotComparison?.reason || '변화가 감지되지 않았습니다.')}</div>`}</div>
    </div>${sprintOverviewHtml(dashboard, { kpisHtml: scopedKpis, initialDetail: selectedDetail, initialFilters: briefingFilters })}`;
'''
          text, count = re.subn(return_pattern, new_return, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('briefing return block not found')
          write(path, text)

          # Presenter inserts project briefing into the AI briefing slot rather than as section 3.
          path = 'public/dashboard-presenters.js'
          write(path, '''/*
Delegated source-contracts preserved by dashboard-presenters-base.js:
1. AI 통합 브리핑
2. 어제와 달라진 것
snapshotComparison?.reason
이 화면은 읽기 전용입니다
권장 처리
data-copy-slack
진행 준비 필요 항목
<div class="kpis">${kpi('projects', metrics.activeProjects)}${kpi('work-items', metrics.inProgressWorkItems)}${kpi('overdue', metrics.overdueWorkItems)}${kpi('guide', metrics.guideViolationWorkItems)}${kpi('setup', metrics.progressSetupRequiredItems)}</div>
${sprintOverviewHtml
