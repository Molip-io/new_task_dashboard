name: Dashboard tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        run: |
          mkdir -p validation
          set -o pipefail
          npm test | tee validation/tests.tap
      - name: Build and syntax checks
        run: |
          set -o pipefail
          npm run build | tee validation/build.log
          node --check public/sprint-policy.js && node --check public/sprint-overview.js && node --check lib/sprint-settings.mjs
      - name: Install browser test driver
        run: python -m pip install playwright==1.57.0
      - name: Browser smoke test with synthetic data
        run: |
          set -o pipefail
          python tools/sprint-browser-smoke.py | tee validation/browser.log
      - name: Archive exact tested sources
        if: always()
        run: |
          mkdir -p validation
          git rev-parse HEAD > validation/tested-commit.txt
          git archive --format=zip HEAD -o validation/tested-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-validation
          path: validation/
          if-no-files-found: error
          retention-days: 3
