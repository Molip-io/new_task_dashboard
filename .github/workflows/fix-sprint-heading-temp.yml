name: Fix sprint heading

on:
  push:
    branches:
      - feat/unified-ai-briefing-20260909

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-ai-briefing-20260909
      - name: Fix heading source and test
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/sprint-overview.js')
          s = p.read_text(encoding='utf-8')
          old = '<h3 id="sprint-overview-title">4. 스프린트별 업무 현황</h3>'
          new = '<h3 id="sprint-overview-title">3. 스프린트별 업무 현황</h3>'
          if old not in s:
              raise SystemExit('sprint heading target missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('test/sprint-overview.test.mjs')
          s = p.read_text(encoding='utf-8')
          old = "assert.ok(html.includes('4. 스프린트별 업무 현황'));"
          new = "assert.ok(html.includes('3. 스프린트별 업무 현황'));"
          if old not in s:
              raise SystemExit('sprint test target missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'MOLIP dashboard bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/fix-sprint-heading-temp.yml
          git add public/sprint-overview.js test/sprint-overview.test.mjs
          git commit -m 'fix: align unified briefing section number'
          git push origin HEAD:feat/unified-ai-briefing-20260909
