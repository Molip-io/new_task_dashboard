name: Patch sprint guide and briefing layout

on:
  push:
    branches:
      - fix/sprint-guide-and-project-layout-20260909

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[patched-dashboard]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sprint-guide-and-project-layout-20260909
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/patch_sprint_guide_layout.py
      - name: Align regression expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('test/sprint-overview.test.mjs')
          text = p.read_text(encoding='utf-8').replace('3. 스프린트별 업무 현황', '4. 스프린트별 업무 현황')
          p.write_text(text, encoding='utf-8')

          p = Path('test/sprint-policy.test.mjs')
          text = p.read_text(encoding='utf-8')
          text, n = re.subn(
              r"test\('Parent issues do not inflate child task KPIs',\(\)=>\{.*?\n\}\);",
              """test('Parent guide issues are visible without changing child-only execution KPIs',()=>{\n  const d=fixture(); d.workItems.push({id:'parent',title:'Parent',itemLevel:'parent',project:'A',sprint:'Sprint3',status:'진행 중',issues:[guide]});\n  const v=buildSprintOverview(d);\n  assert.equal(v.metrics.guideViolationWorkItems,4);\n  assert.equal(v.guideBreakdown.parent,1);\n  assert.equal(v.guideBreakdown.child,3);\n  assert.equal(v.metrics.inProgressWorkItems,4);\n});""",
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('parent guide regression test not found')
          text, n = re.subn(
              r"(test\('Compact snapshot issue links are restored',\(\)=>\{.*?assert\.equal\(buildSprintOverview\(d\)\.metrics\.guideViolationWorkItems,)2(\);)",
              r"\g<1>3\2",
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('compact snapshot regression expectation not found')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Unit tests
        run: npm test
      - name: Build and syntax checks
        run: |
          npm run build
          node --check public/sprint-policy.js
          node --check public/sprint-overview.js
          node --check public/project-briefing.js
      - name: Commit tested patch
        run: |
          git config user.name 'MOLIP dashboard bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/patch-sprint-guide-layout-temp.yml .github/scripts/patch_sprint_guide_layout.py
          git add collect.mjs public/sprint-policy.js public/sprint-overview.js public/sprint-overview.css public/dashboard-presenters-base.js public/project-briefing.js public/project-briefing.css test/sprint-policy.test.mjs test/sprint-overview.test.mjs test/project-briefing.test.mjs tools/sprint-browser-smoke.py
          git commit -m 'fix: [patched-dashboard] align guide scope and project briefing layout'
          git push origin HEAD:fix/sprint-guide-and-project-layout-20260909
