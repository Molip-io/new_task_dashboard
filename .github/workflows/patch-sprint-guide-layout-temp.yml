name: Patch sprint guide and briefing layout

on:
  push:
    branches:
      - fix/sprint-guide-and-project-layout-20260909

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[patched-dashboard]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sprint-guide-and-project-layout-20260909
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/patch_sprint_guide_layout.py
      - name: Unit tests
        run: npm test
      - name: Build and syntax checks
        run: |
          npm run build
          node --check public/sprint-policy.js
          node --check public/sprint-overview.js
          node --check public/project-briefing.js
      - name: Commit tested patch
        run: |
          git config user.name 'MOLIP dashboard bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/patch-sprint-guide-layout-temp.yml .github/scripts/patch_sprint_guide_layout.py
          git add collect.mjs public/sprint-policy.js public/sprint-overview.js public/sprint-overview.css public/dashboard-presenters-base.js public/project-briefing.js public/project-briefing.css test/sprint-policy.test.mjs test/project-briefing.test.mjs tools/sprint-browser-smoke.py
          git commit -m 'fix: [patched-dashboard] align guide scope and project briefing layout'
          git push origin HEAD:fix/sprint-guide-and-project-layout-20260909
