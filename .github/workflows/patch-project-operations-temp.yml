name: Patch project operations evidence flow

on:
  push:
    branches: [feat/project-operations-evidence-20260908]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[ops-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-operations-evidence-20260908
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch UI, collector rules, and agent contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'missing replacement target: {path}: {old[:90]!r}')
              text = text.replace(old, new, 1)
              write(path, text)

          # 1) Project operations: broader but still explicit operational language.
          path = 'lib/project-operations.mjs'
          text = read(path)
          replacements = {
              "release: /(배포|릴리즈|출시|서밋|스토어|마켓\\s*업로드|자동\\s*출시|롤아웃|release|submit)/i,": "release: /(배포|릴리즈|출시|서밋|스토어|마켓\\s*업로드|업로드\\s*완료|자동\\s*출시|심사|검수\\s*제출|롤아웃|release|submit|publish)/i,",
              "qa: /(qa|fun\\s*qa|funqa|디렉터\\s*리뷰|품질\\s*검증)/i,": "qa: /(qa|fun\\s*qa|funqa|테스트|검수|디렉터\\s*리뷰|리뷰\\s*완료|품질\\s*검증|app\\s*tester|testflight)/i,",
              "build: /(빌드|apk|aab|testflight|aos|ios|빌드버전|빌드코드|build)/i,": "build: /(빌드|빌드\\s*공유|업로드\\s*빌드|hotfix|핫픽스|apk|aab|testflight|aos|ios|빌드버전|빌드코드|build)/i,",
              "data: /(데이터|지표|cpi|리텐션|retention|퍼널|funnel|d1|d7|roas|ltv|arpu|분석|tracking\\s*plan|통계)/i,": "data: /(데이터|지표|cpi|리텐션|retention|퍼널|funnel|d1|d7|roas|ltv|arpu|분석|테스트\\s*결과|이벤트\\s*로그|로그\\s*확인|tracking\\s*plan|통계)/i,",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing project operation pattern: {old}')
              text = text.replace(old, new, 1)
          write(path, text)

          # 2) Project operations UI: collapse by default, expand into source-backed lifecycle rows.
          path = 'public/dashboard-presenters.js'
          text = read(path)
          pattern = r"function signal\(event, label\) \{[\s\S]*?\n\}\n\nfunction projectOperationsHtml\(projects = \[\]\) \{[\s\S]*?\n\}\n"
          replacement = r'''function signal(event, label) {
            if (!event) return `<div class="briefing-row"><strong>${esc(label)}</strong><small>현재 수집 범위에서 직접 근거 미확인</small></div>`;
            const body = `<strong>${esc(label)}</strong><small>${esc(event.excerpt || '')}</small><small>${fmt(event.timestamp)}${event.channel ? ` · #${esc(event.channel)}` : ''}</small>`;
            const url = safeUrl(event.url);
            return url === '#' ? `<div class="briefing-row">${body}</div>` : `<a class="briefing-row" href="${esc(url)}" target="_blank" rel="noreferrer">${body}</a>`;
          }

          const OPERATION_LABELS = { build: '빌드', qa: 'QA/리뷰', release: '배포/출시', data: '데이터' };

          function projectOperationSummary(project, ops) {
            const count = Number(ops.evidenceCount || ops.events?.length || ops.evidence?.length || 0);
            const latest = [ops.latestBuild, ops.latestQa, ops.latestRelease, ops.latestData]
              .filter(Boolean)
              .sort((left, right) => String(right.timestamp || '').localeCompare(String(left.timestamp || '')))[0];
            if (!count && !latest) {
              return Array.isArray(project.slack) && project.slack.length
                ? '현재 수집 범위에서 직접 운영 근거 미확인'
                : '프로젝트 Slack 채널 수집 확인 필요';
            }
            const category = OPERATION_LABELS[latest?.category] || '운영';
            return `운영 근거 ${count || 1}건${latest ? ` · 최근 ${category} ${fmt(latest.timestamp)}` : ''}`;
          }

          function projectOperationsHtml(projects = []) {
            const rows = projects.map(project => {
              const ops = project.projectOperations || {};
              const hasEvidence = Boolean(ops.evidenceCount || ops.evidence?.length || ops.latestBuild || ops.latestQa || ops.latestRelease || ops.latestData);
              const emptyNotice = hasEvidence ? '' : '<div class="summary project-operations-empty">현재 수집 범위에서 직접 운영 근거를 확인하지 못했습니다. Slack 수집 상태와 프로젝트 채널 범위를 확인하세요.</div>';
              return `<details class="card span-6 project-operations-card"><summary><div class="project-operations-summary"><strong>${esc(project.name)} · 프로젝트 운영 현황</strong><small>${esc(projectOperationSummary(project, ops))}</small></div><span class="project-operations-toggle"><span class="toggle-open">펼치기</span><span class="toggle-close">접기</span></span></summary><div class="project-operations-body">${emptyNotice}${signal(ops.latestBuild, '빌드')}${signal(ops.latestQa, 'QA/리뷰')}${signal(ops.latestRelease, '배포/출시')}${signal(ops.latestData, '데이터')}</div></details>`;
            }).join('');
            return rows ? `<div class="bento project-operations-bento">${rows}</div>` : '';
          }
          '''
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit('dashboard-presenters project operations block not found')
          write(path, text)

          # 3) Styling for explicit expand/collapse affordance.
          path = 'public/style.css'
          text = read(path)
          marker = '.project-operations-card > summary {'
          if marker not in text:
              addition = r'''

          /* 프로젝트 운영 현황 — 기본 접힘, 클릭 시 운영 근거 상세 노출 */
          .project-operations-bento { margin: 10px 0; }
          .project-operations-card > summary { justify-content: space-between; }
          .project-operations-summary { flex: 1; min-width: 0; }
          .project-operations-summary strong, .project-operations-summary small { display: block; }
          .project-operations-summary strong { font-size: 15px; }
          .project-operations-summary small { margin-top: 5px; color: var(--muted); font-size: 11px; }
          .project-operations-toggle { flex: none; padding: 5px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 11px; font-weight: 700; }
          .project-operations-card[open] .project-operations-toggle { border-color: var(--accent); color: var(--accent); }
          .project-operations-toggle .toggle-close, .project-operations-card[open] .project-operations-toggle .toggle-open { display: none; }
          .project-operations-card[open] .project-operations-toggle .toggle-close { display: inline; }
          .project-operations-body { padding: 4px 18px 16px; border-top: 1px solid var(--line); background: var(--panel-3); }
          .project-operations-empty { margin: 12px 0 4px; color: var(--muted); }
          '''
              text += addition
              write(path, text)

          # 4) Runtime prompt used as the source-of-truth execution guide.
          path = 'prompts/업무대시보드_에이전트_실행지시.md'
          text = read(path)
          text = text.replace(
              '`evidenceRole = recent_execution`은 현재 실제 진행 근거이고 `evidenceRole = persistent_context`는 현재 리뷰·피드백·handoff·역할·완료 기준을 해석하는 과거 업무 합의다.',
              '`evidenceRole = recent_execution`은 현재 실제 진행 근거이고, `evidenceRole = persistent_context`는 현재 리뷰·피드백·handoff·역할·완료 기준을 해석하는 과거 업무 합의이며, `evidenceRole = project_operation`은 특정 스펙이 아닌 프로젝트 전체의 빌드·QA/리뷰·배포/출시·데이터 상태 근거다.'
          )
          text = text.replace(
              '- `sourceEvidenceFormat.columns`의 마지막 열 `evidenceRole`은 `recent_execution` 또는 `persistent_context`만 사용한다.\n- `recent_execution`은 구현 시작·완료·전달·QA·승인·현재 일정·현재 blocker 같은 현재 진행 판단에 사용한다.\n- `persistent_context`는 과거에 합의했지만 현재 리뷰·피드백·handoff·역할·완료 기준에 계속 영향을 주는 업무 방식 맥락으로만 사용한다.',
              '- `sourceEvidenceFormat.columns`의 마지막 열 `evidenceRole`은 `recent_execution`, `persistent_context`, `project_operation`을 사용한다.\n- `recent_execution`은 구현 시작·완료·전달·QA·승인·현재 일정·현재 blocker 같은 현재 진행 판단에 사용한다.\n- `persistent_context`는 과거에 합의했지만 현재 리뷰·피드백·handoff·역할·완료 기준에 계속 영향을 주는 업무 방식 맥락으로만 사용한다.\n- `project_operation`은 `specId = null`인 프로젝트 단위 운영 근거다. 빌드·QA/리뷰·배포/출시·데이터/테스트의 최신 상태를 설명하는 데 사용하고 특정 스펙에 억지로 연결하지 않는다. 원문에 완료·승인·출시·지연·대기가 직접 명시되지 않았다면 그 상태를 추정하지 않는다. 수집된 운영 근거가 없으면 `없음`이 아니라 `현재 수집 범위에서 확인 불가`로 기록한다.'
          )
          if 'project_operation' not in text:
              raise SystemExit('runtime agent prompt project_operation patch failed')
          write(path, text)

          # 5) Agent package instructions: accept and explain project_operation everywhere sourceEvidence roles are defined.
          path = 'agent-package/01_AGENT_INSTRUCTIONS.md'
          text = read(path)
          text = text.replace(
              '`evidenceRole`은 `recent_execution` 또는 `persistent_context`다. `recent_execution`은 현재 실제 진행 근거이고, `persistent_context`는 현재 업무 방식에 계속 영향을 주는 과거 합의 맥락이다.',
              '`evidenceRole`은 `recent_execution`, `persistent_context`, `project_operation`이다. `recent_execution`은 현재 실제 진행 근거이고, `persistent_context`는 현재 업무 방식에 계속 영향을 주는 과거 합의 맥락이며, `project_operation`은 `specId = null`인 프로젝트 전체의 빌드·QA/리뷰·배포/출시·데이터 상태 근거다. `project_operation`을 특정 스펙에 억지로 연결하지 않고, 원문에 직접 명시된 운영 상태만 사용한다. 운영 근거가 수집되지 않았으면 `없음`이 아니라 `현재 수집 범위에서 확인 불가`로 기록한다.'
          )
          text = text.replace(
              '`sourceEvidenceFormat.evidenceRole`이 `recent_execution`이면 현재 실제 진행을 판단하고, `persistent_context`이면 현재 리뷰·피드백·handoff·역할·완료 기준을 해석하는 업무 맥락으로 사용한다.',
              '`sourceEvidenceFormat.evidenceRole`이 `recent_execution`이면 현재 실제 진행을 판단하고, `persistent_context`이면 현재 리뷰·피드백·handoff·역할·완료 기준을 해석하는 업무 맥락으로 사용하며, `project_operation`이면 특정 스펙과 분리된 프로젝트 단위의 빌드·QA/리뷰·배포/출시·데이터 상태를 설명하는 근거로 사용한다.'
          )
          if text.count('project_operation') < 2:
              raise SystemExit('agent package instructions project_operation patch failed')
          write(path, text)

          # 6) Daily run prompt: same contract in the actual execution loop.
          path = 'agent-package/02_DAILY_RUN_PROMPT.md'
          text = read(path)
          old = '`evidenceRole = recent_execution`은 현재 실제 진행 근거로, `evidenceRole = persistent_context`는 현재 리뷰·피드백·handoff·역할·완료 기준을 해석하는 업무 맥락으로 사용해.'
          new = '`evidenceRole = recent_execution`은 현재 실제 진행 근거로, `evidenceRole = persistent_context`는 현재 리뷰·피드백·handoff·역할·완료 기준을 해석하는 업무 맥락으로, `evidenceRole = project_operation`은 `specId = null`인 프로젝트 전체의 빌드·QA/리뷰·배포/출시·데이터 상태 근거로 사용해. `project_operation`은 특정 스펙에 억지로 연결하지 말고 원문에 직접 명시된 상태만 기록해. 수집된 운영 근거가 없으면 `없음`으로 단정하지 말고 `현재 수집 범위에서 확인 불가`로 기록해.'
          if old not in text:
              raise SystemExit('daily run project_operation target missing')
          write(path, text.replace(old, new, 1))

          # 7) Contract tests.
          path = 'test/agent-instruction-contract.test.mjs'
          text = read(path)
          old = "    assert.match(document, /recent_execution/);\n    assert.match(document, /blocker로 만들지/);"
          new = "    assert.match(document, /recent_execution/);\n    assert.match(document, /project_operation/);\n    assert.match(document, /현재 수집 범위에서 확인 불가/);\n    assert.match(document, /blocker로 만들지/);"
          if old not in text:
              raise SystemExit('agent instruction test target missing')
          write(path, text.replace(old, new, 1))

          # 8) Add focused collector test.
          Path('test/project-operations.test.mjs').write_text(r'''import assert from 'node:assert/strict';
          import test from 'node:test';

          import { buildProjectOperations } from '../lib/project-operations.mjs';

          test('Given recent project Slack lifecycle messages, When operations are built, Then build QA release and data evidence are classified', () => {
            const messages = [
              ['2026-09-04T09:00:00.000Z', 'SP3 업로드 빌드 공유 완료 · APK와 TestFlight 전달'],
              ['2026-09-04T10:00:00.000Z', 'Fun QA 및 디렉터 리뷰 진행 후 검수 예정'],
              ['2026-09-04T11:00:00.000Z', 'AOS 마켓 업로드 완료, iOS 자동 출시'],
              ['2026-09-04T12:00:00.000Z', 'CPI 테스트 결과 지표와 이벤트 로그 확인'],
            ].map(([time, text], index) => ({ time, text, url: `https://slack.test/${index}` }));
            const operations = buildProjectOperations([{ channel: 's2_forge_and_fortune', messages }]);

            assert.ok(operations.latestBuild);
            assert.ok(operations.latestQa);
            assert.ok(operations.latestRelease);
            assert.ok(operations.latestData);
            assert.ok(operations.evidenceCount >= 4);
            assert.equal(operations.evidence.every(item => item.evidenceRole === 'project_operation'), true);
          });
          ''', encoding='utf-8')

          # 9) Add presenter contract test for collapsed/expanded project operations UI.
          path = 'test/dashboard-presenters.test.mjs'
          text = read(path)
          if 'project operations render collapsed' not in text:
              text += r'''

          test('Given project operational evidence, When briefing renders, Then project operations render collapsed with an expandable evidence body', () => {
            const dashboard = {
              metrics: {}, validationIssues: [], deltas: [], git: { repositories: [] }, ai: { overall: {} },
              projects: [{
                name: '포지 앤 포춘', stats: {}, slack: [{ channel: 's2_forge_and_fortune', count: 4 }],
                projectOperations: {
                  evidenceCount: 4,
                  latestBuild: { category: 'build', excerpt: 'SP3 빌드 공유 완료', timestamp: '2026-09-04T09:00:00.000Z', channel: 's2_forge_and_fortune', url: 'https://slack.test/build' },
                  latestQa: { category: 'qa', excerpt: 'Fun QA 진행', timestamp: '2026-09-04T10:00:00.000Z', channel: 's2_forge_and_fortune', url: 'https://slack.test/qa' },
                  latestRelease: { category: 'release', excerpt: '마켓 업로드 완료', timestamp: '2026-09-04T11:00:00.000Z', channel: 's2_forge_and_fortune', url: 'https://slack.test/release' },
                  latestData: { category: 'data', excerpt: 'CPI 테스트 결과 확인', timestamp: '2026-09-04T12:00:00.000Z', channel: 's2_forge_and_fortune', url: 'https://slack.test/data' },
                },
              }],
            };

            const html = briefingHtml(dashboard, null, () => '');
            assert.match(html, /<details class="card span-6 project-operations-card">/);
            assert.match(html, /운영 근거 4건/);
            assert.match(html, /펼치기/);
            assert.match(html, /접기/);
            assert.match(html, /SP3 빌드 공유 완료/);
            assert.match(html, /Fun QA 진행/);
          });

          test('Given collected project Slack but no classified operation evidence, When briefing renders, Then absence is described as unconfirmed rather than nonexistent', () => {
            const dashboard = {
              metrics: {}, validationIssues: [], deltas: [], git: { repositories: [] }, ai: { overall: {} },
              projects: [{ name: '포지 앤 포춘', stats: {}, slack: [{ channel: 's2_forge_and_fortune', count: 1 }], projectOperations: {} }],
            };
            const html = briefingHtml(dashboard, null, () => '');
            assert.match(html, /현재 수집 범위에서 직접 운영 근거 미확인/);
            assert.doesNotMatch(html, /운영 근거를 찾지 못했습니다/);
          });
          '''
              write(path, text)
          PY
      - name: Unit tests
        run: npm test
      - name: Build and syntax checks
        run: npm run build
      - name: Commit tested patch
        run: |
          git config user.name 'MOLIP deploy bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/patch-project-operations-temp.yml
          git add public/dashboard-presenters.js public/style.css lib/project-operations.mjs prompts/업무대시보드_에이전트_실행지시.md agent-package/01_AGENT_INSTRUCTIONS.md agent-package/02_DAILY_RUN_PROMPT.md test/agent-instruction-contract.test.mjs test/dashboard-presenters.test.mjs test/project-operations.test.mjs
          git commit -m 'fix: [ops-patched] expand project operations evidence'
          git push origin HEAD:feat/project-operations-evidence-20260908
