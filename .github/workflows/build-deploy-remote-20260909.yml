name: Build immutable Vercel runtime 20260909

on:
  push:
    branches:
      - ops/vercel-payload-20260909

permissions:
  contents: write

jobs:
  build-runtime:
    if: ${{ !contains(github.event.head_commit.message, '[remote-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/vercel-payload-20260909
          fetch-depth: 1
      - name: Build bundled server and compressed assets
        run: |
          rm -rf deploy-src deploy-build deploy-remote deploy-smoke
          mkdir -p deploy-src/api deploy-build deploy-remote deploy-smoke/api
          cp api/app.mjs deploy-src/api/app.mjs
          cp collect.mjs deploy-src/collect.mjs
          cp -R lib deploy-src/lib
          python - <<'PY'
          from pathlib import Path
          p=Path('deploy-src/lib/env.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace("import { fileURLToPath } from 'node:url';\n", '')
          s=s.replace("export const ROOT = path.dirname(path.dirname(fileURLToPath(import.meta.url)));", "export const ROOT = process.cwd();")
          p.write_text(s, encoding='utf-8')
          PY
          npx --yes esbuild@0.25.9 deploy-src/api/app.mjs \
            --bundle --platform=node --format=esm --target=node22 --minify \
            --outfile=deploy-build/core-source.mjs
          python - <<'PY'
          import base64, gzip, json, pathlib
          root=pathlib.Path('.')
          remote=root/'deploy-remote'
          smoke=root/'deploy-smoke'/'api'
          assets={}
          for name in ['config.json']:
              p=root/name
              assets[name]=p.read_text(encoding='utf-8')
          for folder in ['public','prompts','schemas']:
              for p in sorted((root/folder).rglob('*')):
                  if p.is_file():
                      assets[p.as_posix()]=p.read_text(encoding='utf-8')
          core=(root/'deploy-build/core-source.mjs').read_bytes()
          core64=base64.b64encode(gzip.compress(core, compresslevel=9)).decode('ascii')
          asset64=base64.b64encode(gzip.compress(json.dumps(assets,ensure_ascii=False,separators=(',',':')).encode('utf-8'), compresslevel=9)).decode('ascii')
          (remote/'core.b64').write_text(core64,encoding='ascii')
          (remote/'assets.b64').write_text(asset64,encoding='ascii')
          source='b6844ae7114a5fa01ddf0aba9f7517294dc5c079'
          (remote/'manifest.json').write_text(json.dumps({'sourceCommit':source,'coreChars':len(core64),'assetChars':len(asset64)},indent=2),encoding='utf-8')
          wrapper=f'''import fs from 'node:fs';
import path from 'node:path';
import {{ fileURLToPath, pathToFileURL }} from 'node:url';
import {{ gunzipSync }} from 'node:zlib';
const root=process.cwd();
const coreB64={json.dumps(core64)};
const assetB64={json.dumps(asset64)};
const assetSource=JSON.parse(gunzipSync(Buffer.from(assetB64,'base64')).toString('utf8'));
const virtual=new Map();
for(const [name,value] of Object.entries(assetSource)){{const buffer=Buffer.from(value,'utf8');virtual.set(path.resolve(root,name),buffer);virtual.set(path.resolve('/',name),buffer);}}
const keyFor=(target)=>{{if(target instanceof URL)return fileURLToPath(target);const text=String(target);if(text.startsWith('file:'))return fileURLToPath(text);return path.resolve(text);}};
const originalRead=fs.readFileSync.bind(fs);
const originalExists=fs.existsSync.bind(fs);
const originalStat=fs.statSync.bind(fs);
fs.existsSync=(target)=>virtual.has(keyFor(target))||originalExists(target);
fs.readFileSync=(target,options)=>{{const value=virtual.get(keyFor(target));if(!value)return originalRead(target,options);const enc=typeof options==='string'?options:options?.encoding;return enc?value.toString(enc):Buffer.from(value);}};
fs.statSync=(target,...args)=>{{const value=virtual.get(keyFor(target));if(!value)return originalStat(target,...args);return {{size:value.length,isFile:()=>true,isDirectory:()=>false}};}};
let corePromise;
async function loadCore(){{if(!corePromise){{const source=gunzipSync(Buffer.from(coreB64,'base64'));const corePath=path.join('/tmp','molip-dashboard-core-b6844.mjs');fs.writeFileSync(corePath,source);corePromise=import(pathToFileURL(corePath).href);}}return corePromise;}}
export default async function handler(request,response){{const mod=await loadCore();return mod.default(request,response);}}
'''
          (smoke/'app.mjs').write_text(wrapper,encoding='utf-8')
          print({'sourceCommit':source,'coreChars':len(core64),'assetChars':len(asset64),'assetFiles':len(assets)})
          PY
      - name: Verify bundled runtime and new UI contracts
        run: |
          node --input-type=module <<'JS'
          import handler from './deploy-smoke/api/app.mjs';
          async function request(url){
            let body=Buffer.alloc(0);
            const response={statusCode:0,headers:{},setHeader(k,v){this.headers[k]=v;},end(value){body=Buffer.isBuffer(value)?value:Buffer.from(String(value??''));}};
            await handler({url,method:'GET',headers:{}},response);
            return {status:response.statusCode,text:body.toString('utf8')};
          }
          const shell=await request('/');
          if(shell.status!==200 || !shell.text.includes('업무현황 대시보드')) throw new Error('dashboard shell smoke failed');
          const policy=await request('/sprint-policy.js');
          if(policy.status!==200 || !policy.text.includes("SPRINT_POLICY_VERSION = '2026-09-09.1'")) throw new Error('sprint policy version missing');
          const sprint=await request('/sprint-overview.js');
          if(sprint.status!==200 || !sprint.text.includes('GUIDE COVERAGE') || !sprint.text.includes('4. 스프린트별 업무 현황')) throw new Error('sprint overview contract missing');
          const project=await request('/project-briefing.js');
          if(project.status!==200 || !project.text.includes('PROJECT BRIEFING') || !project.text.includes('project-briefing-tri-grid')) throw new Error('project briefing contract missing');
          console.log('immutable runtime smoke ok');
          JS
      - name: Commit immutable runtime bundle
        run: |
          git config user.name 'MOLIP deploy bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f deploy-remote
          git commit -m 'chore: [remote-generated] immutable Vercel runtime for b6844ae7'
          git push origin HEAD:ops/vercel-payload-20260909
